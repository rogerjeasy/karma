<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Winner — 2nd Place, Dynatrace Track, Google Cloud Rapid Agent Hackathon, 14,484 participants">
  <title>Karma — 2nd Place, Dynatrace Track, Google Cloud Rapid Agent Hackathon</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C1A"/>
      <stop offset="45%" stop-color="#101833"/>
      <stop offset="100%" stop-color="#0A1226"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#D7DEE9"/>
      <stop offset="65%" stop-color="#9AA6B8"/>
      <stop offset="100%" stop-color="#E6ECF5"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#1284CC"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ghostGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7FD4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7FD4FF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card">
      <rect x="4" y="4" width="992" height="262" rx="22"/>
    </clipPath>

    <style>
      .t { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      /* Entrance is additive only — base state stays fully visible so the
         banner reads correctly in renderers that don't run CSS animations. */
      .fade { animation: fadeUp .9s ease-out 1; }
      .d1 { animation-delay: .05s } .d2 { animation-delay: .2s }
      .d3 { animation-delay: .35s } .d4 { animation-delay: .5s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

      .sweep { animation: sweep 4.5s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sweep { 0% { transform: translateX(-520px) } 55%,100% { transform: translateX(1080px) } }

      .ring { animation: spin 9s linear infinite; transform-origin: 108px 132px; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 108px 132px; }
      @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:.85; transform: scale(1.06) } }

      .bob { animation: bob 5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }

      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      .s2 { animation-delay: .7s } .s3 { animation-delay: 1.4s }
      .s4 { animation-delay: 2.1s } .s5 { animation-delay: 2.7s } .s6 { animation-delay: 1.1s }
      @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.9 } }

      .live { animation: live 1.8s ease-in-out infinite; }
      @keyframes live { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    </style>
  </defs>

  <rect x="4" y="4" width="992" height="262" rx="22" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <!-- ambient glows -->
    <ellipse cx="120" cy="140" rx="240" ry="180" fill="url(#glow)"/>
    <ellipse cx="880" cy="120" rx="180" ry="150" fill="url(#ghostGlow)"/>

    <!-- starfield -->
    <g fill="#CFE3FF">
      <circle class="twinkle"    cx="330" cy="42"  r="1.8"/>
      <circle class="twinkle s2" cx="512" cy="30"  r="1.4"/>
      <circle class="twinkle s3" cx="690" cy="58"  r="2.0"/>
      <circle class="twinkle s4" cx="770" cy="210" r="1.6"/>
      <circle class="twinkle s5" cx="430" cy="232" r="1.5"/>
      <circle class="twinkle s6" cx="944" cy="188" r="1.7"/>
    </g>

    <!-- medal -->
    <g>
      <circle class="pulse" cx="108" cy="132" r="54" fill="#8B5CF6" opacity="0.4"/>
      <g class="ring" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
        <circle cx="108" cy="132" r="50" stroke-dasharray="42 22" opacity="0.9"/>
      </g>
      <circle cx="108" cy="132" r="38" fill="url(#silver)"/>
      <circle cx="108" cy="132" r="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <text class="t" x="108" y="146" text-anchor="middle" font-size="34" font-weight="700" fill="#131A33">2</text>
      <text class="t" x="132" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#131A33">nd</text>
    </g>

    <!-- copy -->
    <g class="t">
      <g class="fade d1">
        <rect x="184" y="40" width="126" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.3" stroke="#A78BFA" stroke-opacity="0.75"/>
        <circle class="live" cx="200" cy="53" r="4" fill="#34D399"/>
        <text x="212" y="58" font-size="13" font-weight="700" letter-spacing="1.6" fill="#EDE4FF">WINNER</text>
      </g>

      <text class="fade d2" x="184" y="112" font-size="38" font-weight="800" letter-spacing="0.5" fill="url(#silver)">2nd Place · Dynatrace Track</text>

      <text class="fade d3" x="184" y="148" font-size="20" font-weight="600" fill="#9BB3D9">Google Cloud Rapid Agent Hackathon</text>

      <text class="fade d3" x="184" y="180" font-size="15" fill="#6E86AE">Karma — The Reincarnation Agent for Deprecated Services</text>

      <g class="fade d4">
        <rect x="184" y="200" width="176" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="200" y="219" font-size="13" font-weight="600" fill="#AFC4E4">14,484 participants</text>
        <rect x="370" y="200" width="196" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="386" y="219" font-size="13" font-weight="600" fill="#AFC4E4">Announced July 16, 2026</text>
      </g>
    </g>

    <!-- ghost -->
    <g class="bob" opacity="0.9">
      <path d="M840 92c0-27 22-49 49-49s49 22 49 49v78c0 6-7 9-11 5l-11-11c-3-3-8-3-11 0l-10 10c-3 3-8 3-11 0l-10-10c-3-3-8-3-11 0l-11 11c-4 4-12 1-12-5z"
            fill="#DCE9FF" fill-opacity="0.92"/>
      <circle cx="874" cy="92" r="7" fill="#101833"/>
      <circle cx="904" cy="92" r="7" fill="#101833"/>
      <path d="M876 116c6 7 20 7 26 0" stroke="#101833" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- shine sweep -->
    <rect class="sweep" x="-520" y="0" width="420" height="270" fill="url(#shine)" transform="skewX(-18)"/>
  </g>

  <rect x="4" y="4" width="992" height="262" rx="22" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
