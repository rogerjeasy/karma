<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-label="Karma — 2nd Place, Dynatrace Track, Google Cloud Rapid Agent Hackathon 2026">
  <title>Karma — 2nd Place, Dynatrace Track, Google Cloud Rapid Agent Hackathon 2026</title>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080C1A"/>
      <stop offset="50%" stop-color="#111A36"/>
      <stop offset="100%" stop-color="#080C1A"/>
    </linearGradient>
    <linearGradient id="fsilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C9D3E2"/>
      <stop offset="100%" stop-color="#EEF3FA"/>
    </linearGradient>
    <linearGradient id="faccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#1284CC"/>
    </linearGradient>
    <linearGradient id="fshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fcard">
      <rect x="3" y="3" width="994" height="90" rx="18"/>
    </clipPath>
    <style>
      .ft { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .fsweep { animation: fsweep 5s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes fsweep { 0% { transform: translateX(-460px) } 60%,100% { transform: translateX(1100px) } }
      .fring { animation: fspin 10s linear infinite; transform-origin: 62px 48px; }
      @keyframes fspin { to { transform: rotate(360deg) } }
      .fbob { animation: fbob 4.5s ease-in-out infinite; }
      @keyframes fbob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .fdot { animation: fdot 2s ease-in-out infinite; }
      @keyframes fdot { 0%,100% { opacity:1 } 50% { opacity:.2 } }
    </style>
  </defs>

  <rect x="3" y="3" width="994" height="90" rx="18" fill="url(#fbg)"/>

  <g clip-path="url(#fcard)">
    <g class="fring" fill="none" stroke="url(#faccent)" stroke-width="2" stroke-linecap="round">
      <circle cx="62" cy="48" r="28" stroke-dasharray="26 14"/>
    </g>
    <circle cx="62" cy="48" r="21" fill="url(#fsilver)"/>
    <text class="ft" x="62" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#131A33">2</text>
    <text class="ft" x="75" y="42" text-anchor="middle" font-size="9" font-weight="700" fill="#131A33">nd</text>

    <g class="ft">
      <text x="106" y="43" font-size="19" font-weight="800" letter-spacing="0.3" fill="url(#fsilver)">2nd Place · Dynatrace Track</text>
      <text x="106" y="66" font-size="13" fill="#8FA8CE">Google Cloud Rapid Agent Hackathon 2026 · 14,484 participants</text>
    </g>

    <g class="fbob" opacity="0.9" transform="translate(0,-2)">
      <path d="M900 34c0-13 10-23 23-23s23 10 23 23v37c0 3-4 4-6 2l-5-5c-2-2-4-2-6 0l-5 5c-2 2-4 2-6 0l-5-5c-2-2-4-2-6 0l-5 5c-2 2-6 1-6-2z"
            fill="#DCE9FF" fill-opacity="0.9"/>
      <circle cx="916" cy="34" r="3.4" fill="#101833"/>
      <circle cx="930" cy="34" r="3.4" fill="#101833"/>
    </g>

    <circle class="fdot" cx="962" cy="34" r="3" fill="#34D399"/>

    <rect class="fsweep" x="-460" y="0" width="340" height="96" fill="url(#fshine)" transform="skewX(-18)"/>
  </g>

  <rect x="3" y="3" width="994" height="90" rx="18" fill="none" stroke="url(#faccent)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
